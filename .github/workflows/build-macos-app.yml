name: Build macOS app

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write   # the release step below
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcrun swiftc --version

      - name: Build Hello.app
        run: ./build.sh

      - name: Inspect bundle
        run: |
          find build/Hello.app -print | sed 's|^build/||'
          plutil -p build/Hello.app/Contents/Info.plist
          codesign --display --verbose=2 build/Hello.app 2>&1

      # Launches the app at a light (14:00) and a dark (19:00) time of day, checks
      # that it keeps running, and takes a screenshot of its window each time.
      - name: Smoke test and screenshots
        run: |
          mkdir -p build/shots
          for hour in 14 19; do
            HELLO_WINDOW_ID_FILE="$PWD/build/shots/window-$hour.txt" \
              build/Hello.app/Contents/MacOS/Hello -HelloHour "$hour" \
              > "build/shots/log-$hour.txt" 2>&1 &
            pid=$!
            sleep 8
            kill -0 "$pid"
            if [[ -s "build/shots/window-$hour.txt" ]]; then
              screencapture -x -o -l "$(cat "build/shots/window-$hour.txt")" "build/shots/hour-$hour.png" \
                || screencapture -x "build/shots/hour-$hour.png"
            else
              screencapture -x "build/shots/hour-$hour.png"
            fi
            kill "$pid"
            wait "$pid" || true
            echo "--- app output ($hour:00) ---"
            cat "build/shots/log-$hour.txt"
          done

      # ditto keeps the executable bit and code signature intact inside the zip.
      - name: Package
        run: ditto -c -k --keepParent build/Hello.app build/Hello.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Hello-macOS
          path: build/Hello.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Hello-screenshots
          path: build/shots/*.png
          if-no-files-found: ignore

      # Small JPEG copies of the screenshots, base64-encoded into the log, so
      # they can be inspected without downloading the artifact.
      - name: Print screenshots
        run: |
          for f in build/shots/*.png; do
            [[ -f "$f" ]] || continue
            sips -s format jpeg -s formatOptions 60 -Z 1000 "$f" --out "${f%.png}.jpg" > /dev/null
            echo "=== BEGIN $(basename "${f%.png}").jpg ==="
            base64 -i "${f%.png}.jpg" | fold -w 4000
            echo "=== END ==="
          done

      # Every build of main is published as the GitHub Release of its version: tag
      # v<version>, asset Hello-<version>.zip. A later build of the same version replaces
      # the app and moves the tag to its commit. Other branches only build.
      - name: Publish as a GitHub Release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INFO=build/Hello.app/Contents/Info.plist
          VERSION=$(plutil -extract CFBundleShortVersionString raw "$INFO")
          MINOS=$(plutil -extract LSMinimumSystemVersion raw "$INFO")
          test -n "$VERSION"
          TAG="v$VERSION"
          ASSET="build/Hello-$VERSION.zip"
          cp build/Hello.zip "$ASSET"
          TITLE="Hello $VERSION"
          NOTES="Hello $VERSION for macOS $MINOS and later (Apple Silicon and Intel), built from $GITHUB_SHA by run $GITHUB_RUN_ID. Unzip Hello-$VERSION.zip to get Hello.app. It is ad-hoc signed, not notarised: the first time, open it and choose System Settings > Privacy & Security > Open Anyway, or run xattr -dr com.apple.quarantine Hello.app. What is new: README, section Versions."
          # create the release, or (it exists: an earlier build of this version, possibly
          # made by releases.yml a moment ago) move its tag here and replace the app
          if gh release view "$TAG" > /dev/null 2>&1 \
             || ! gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url --jq .url)"
